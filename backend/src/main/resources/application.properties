spring.application.name=Foundly

# Dapat diganti melalui environment variable PORT jika port 8080 sedang dipakai.
server.port=${PORT:8080}
# Tahap pengembangan lokal; login dan otorisasi belum tersedia.
server.address=127.0.0.1
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3307}/foundly?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Jakarta
spring.datasource.username=foundly
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
