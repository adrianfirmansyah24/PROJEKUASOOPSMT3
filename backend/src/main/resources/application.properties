spring.application.name=Foundly

# Dapat diganti melalui environment variable PORT jika port 8080 sedang dipakai.
server.port=${PORT:8080}
# Tahap pengembangan lokal; server hanya menerima koneksi dari komputer ini.
server.address=127.0.0.1
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3307}/foundly?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Jakarta
spring.datasource.username=foundly
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Frontend lokal yang boleh mengirim cookie sesi ke backend.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FOUNDLY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
